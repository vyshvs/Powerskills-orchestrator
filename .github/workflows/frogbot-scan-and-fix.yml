# This workflow uses Frogbot to automatically scan for vulnerabilities and create PRs with fixes
# Frogbot uses JFrog Xray to scan the project
# Read more: https://docs.jfrog-applications.jfrog.io/jfrog-applications/frogbot

name: "Frogbot Scan and Fix"

on:
  push:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  create-fix-pull-requests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run Frogbot
        uses: jfrog/frogbot@5d9c42c30f1169d8be4ba5510b40e75ffcbbc2a9  # v2.21.2
        env:
          # [Optional for zero-dependency projects]
          # Install command - not needed since this project has zero dependencies
          # JF_INSTALL_DEPS_CMD: "npm install"

          # [Mandatory]
          # JFrog platform URL - requires JFrog account setup
          # You need to set this secret in GitHub: Settings > Secrets and variables > Actions
          JF_URL: ${{ secrets.JF_URL }}

          # [Mandatory]
          # JFrog access token with 'read' permissions on Xray service
          # Generate this from your JFrog account and add to GitHub secrets
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

          # [Mandatory]
          # GitHub token automatically generated for the job
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # [Optional]
          # Branch to create PRs against
          JF_GIT_BASE_BRANCH: main

      - name: Summary
        if: always()
        run: |
          echo "## Frogbot Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frogbot has scanned the project for vulnerabilities." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: PowerSkills Memory Orchestrator" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependencies**: Zero (pure JavaScript)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Check PRs for any vulnerability fixes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: This project has zero production dependencies, so vulnerability surface is minimal." >> $GITHUB_STEP_SUMMARY
